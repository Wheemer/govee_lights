name: Protocol regression

on:
  pull_request:
  push:
    branches:
      - master
      - feature/**

permissions:
  contents: read

jobs:
  legacy-frames:
    name: Legacy BLE frame tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install focused test tools
        run: python -m pip install --upgrade pytest ruff
      - name: Compile integration sources
        run: python -m compileall -q custom_components/govee_lights tests
      - name: Run pure protocol and profile regressions
        run: python -m pytest -q tests/test_models.py tests/test_legacy_protocol.py
      - name: Lint changed protocol surface
        run: >-
          ruff check --ignore E501
          custom_components/govee_lights/models.py
          custom_components/govee_lights/legacy_protocol.py
          custom_components/govee_lights/govee_ble.py
          tests/test_models.py
          tests/test_legacy_protocol.py
